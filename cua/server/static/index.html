<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1C1E">
<title>Buddy</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root {
  --bg: #1C1C1E; --text: #F5F5F7; --sub: #98989D; --card: #2C2C2E;
  --border: #3A3A3C; --accent: #0A84FF; --green: #30D158; --red: #FF453A;
  --amber: #FF9F0A; --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F5F5F7; --text: #1D1D1F; --sub: #86868B; --card: #FFFFFF;
    --border: #D2D2D7; --accent: #0A84FF; --green: #30D158; --red: #FF453A;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
.header {
  text-align: center; padding: 48px 24px 16px;
}
.header h1 {
  font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
}
.header p {
  color: var(--sub); font-size: 14px; margin-top: 4px;
}
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px; vertical-align: middle;
}
.status-dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.status-dot.error { background: var(--red); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.history {
  flex: 1; overflow-y: auto; padding: 0 16px 16px;
  -webkit-overflow-scrolling: touch;
}
.task-card {
  background: var(--card); border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 8px; border: 1px solid var(--border);
}
.task-card .cmd {
  font-size: 15px; font-weight: 500; margin-bottom: 6px;
}
.task-card .steps {
  font-size: 13px; color: var(--sub); line-height: 1.6;
}
.task-card .step-ok::before { content: "✓ "; color: var(--green); }
.task-card .step-fail::before { content: "✗ "; color: var(--red); }
.task-card .timing {
  font-size: 11px; color: var(--sub); margin-top: 6px; opacity: 0.7;
}

.input-area {
  padding: 8px 16px calc(12px + var(--safe-bottom));
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.voice-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 24px; padding: 6px 6px 6px 16px;
  border: 1px solid var(--border);
}
.voice-bar input {
  flex: 1; border: none; background: transparent; color: var(--text);
  font-size: 16px; outline: none; font-family: inherit;
  min-width: 0;
}
.voice-bar input::placeholder { color: var(--sub); }
.mic-btn, .send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background 0.15s;
}
.mic-btn { background: var(--border); }
.mic-btn.listening { background: var(--red); animation: pulse 1s infinite; }
.mic-btn.unavailable { opacity: 0.35; cursor: not-allowed; }
.mic-btn svg { fill: var(--text); width: 20px; height: 20px; }
.send-btn { background: var(--accent); }
.send-btn:disabled { background: var(--border); opacity: 0.5; }
.send-btn svg { fill: white; width: 18px; height: 18px; }

.transcript {
  font-size: 14px; color: var(--sub); padding: 8px 16px 0;
  min-height: 0; transition: min-height 0.2s;
  font-style: italic;
}
.transcript.active { min-height: 24px; }

.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 20px; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  max-width: 85vw; text-align: center;
}
.toast.show { opacity: 1; }
.connect-bar {
  text-align: center; padding: 12px; font-size: 13px; color: var(--sub);
}
.connect-bar input {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 8px 12px; font-size: 16px; width: 100%;
  max-width: 220px; text-align: center; font-family: monospace; letter-spacing: 2px;
}
.connect-bar button {
  background: var(--accent); color: white; border: none; border-radius: 8px;
  padding: 8px 20px; font-size: 14px; cursor: pointer; margin-top: 8px;
}
.insecure-banner {
  background: var(--amber); color: #1D1D1F; font-size: 12px; text-align: center;
  padding: 6px 12px; display: none;
}
</style>
</head>
<body>
<div class="insecure-banner" id="insecure-banner">
  Not a secure connection -- the microphone will not work. Use the https:// link Buddy printed on the laptop.
</div>
<div class="header">
  <h1>Buddy</h1>
  <p><span class="status-dot" id="dot"></span><span id="status">Connecting...</span></p>
</div>

<div id="connect-screen" class="connect-bar">
  <p style="margin-bottom:12px">Enter your PIN</p>
  <input id="pin-input" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off" maxlength="64">
  <br>
  <button onclick="login()">Log in</button>
</div>

<div id="main" style="flex:1;display:none;flex-direction:column">
  <div class="transcript" id="transcript"></div>
  <div class="history" id="history"></div>
  <div class="input-area">
    <div class="voice-bar">
      <input id="cmd" type="text" placeholder="What can I help with?" autocomplete="off"
             enterkeyhint="send">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Tap to speak">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button class="send-btn" id="send-btn" onclick="sendCmd()" disabled>
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// No session in the URL, ever -- it lives only in memory (and sessionStorage, cleared when the tab closes).
let ws = null, session = sessionStorage.getItem('buddy_session') || '', busy = false, recognition = null, listening = false;

if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  document.getElementById('insecure-banner').style.display = 'block';
}

if (session) tryResume();

function login() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  fetch('/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pin})
  }).then(r => r.json().then(d => ({status: r.status, d}))).then(({status, d}) => {
    if (status === 429) { toast('Too many attempts -- wait a bit and try again'); return; }
    if (!d.session) { toast('Wrong PIN'); return; }
    session = d.session;
    sessionStorage.setItem('buddy_session', session);
    document.getElementById('pin-input').value = '';
    enterApp();
  }).catch(() => toast('Could not reach Buddy'));
}

function tryResume() {
  fetch('/status', {headers: {'Authorization': 'Bearer ' + session}}).then(r => {
    if (r.ok) { enterApp(); } else { session = ''; sessionStorage.removeItem('buddy_session'); }
  }).catch(() => {});
}

function enterApp() {
  document.getElementById('connect-screen').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  document.getElementById('cmd').focus();
  connectEvents();
  checkMic();
}

function logout() {
  fetch('/auth/logout', {method: 'POST', headers: {'Authorization': 'Bearer ' + session}}).finally(() => {
    sessionStorage.removeItem('buddy_session');
    location.reload();
  });
}

function connectEvents() {
  const wsScheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsPort = parseInt(location.port || (wsScheme === 'wss' ? '443' : '80')) + 1;
  ws = new WebSocket(`${wsScheme}://${location.hostname}:${wsPort}`);
  ws.onopen = () => ws.send(JSON.stringify({session}));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error === 'unauthorized') { toast('Session expired -- log in again'); logout(); return; }
    if (d.type === 'connected') { setStatus('Ready', 'idle'); return; }
    handleEvent(d);
  };
  ws.onclose = () => { setStatus('Disconnected', 'error'); setTimeout(connectEvents, 3000); };
  ws.onerror = () => {};
}

function handleEvent(d) {
  if (d.type === 'received') {
    addCard(d.id, d.text);
    setStatus('Planning...', 'busy');
    busy = true;
  } else if (d.type === 'executing') {
    setStatus(`Running ${(d.steps || []).length} step(s)...`, 'busy');
  } else if (d.type === 'step_start') {
    setStatus(`Step ${d.index+1}: ${d.action.replace(/_/g,' ')}`, 'busy');
  } else if (d.type === 'completed' || d.type === 'failed' || d.type === 'cancelled') {
    busy = false;
    updateCard(d.id, d);
    setStatus(d.ok ? 'Done' : (d.type === 'cancelled' ? 'Stopped' : 'Failed'), d.ok ? 'idle' : 'error');
    setTimeout(() => { if (!busy) setStatus('Ready', 'idle'); }, 3000);
  }
}

function setStatus(text, mode) {
  document.getElementById('status').textContent = text;
  const dot = document.getElementById('dot');
  dot.className = 'status-dot' + (mode === 'busy' ? ' busy' : mode === 'error' ? ' error' : '');
}

function sendCmd() {
  const input = document.getElementById('cmd');
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  fetch('/task', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session},
    body: JSON.stringify({text})
  }).then(r => r.json()).then(d => {
    if (d.error) toast(d.error);
  }).catch(() => toast('Failed to send'));
}

function addCard(id, text) {
  const h = document.getElementById('history');
  const card = document.createElement('div');
  card.className = 'task-card';
  card.id = 'task-' + id;
  card.innerHTML = `<div class="cmd">${esc(text)}</div><div class="steps" id="steps-${id}">Working...</div>`;
  h.insertBefore(card, h.firstChild);
}

function updateCard(id, d) {
  const el = document.getElementById('steps-' + id);
  if (!el) return;
  if (d.steps && d.steps.length) {
    el.innerHTML = d.steps.map(s =>
      `<div class="${s.ok ? 'step-ok' : 'step-fail'}">${esc(s.action.replace(/_/g,' '))}${s.detail ? ' — '+esc(s.detail.substring(0,60)) : ''}</div>`
    ).join('');
  } else {
    el.textContent = d.ok ? 'Done' : (d.reason || 'Failed');
  }
  if (d.total_ms) {
    const t = document.createElement('div');
    t.className = 'timing';
    t.textContent = `${(d.total_ms/1000).toFixed(1)}s`;
    el.parentElement.appendChild(t);
  }
}

// ---- microphone: diagnose WHY before trying, so the error is actionable, not just "No microphone access" ----
function micDiagnosis() {
  const secure = window.isSecureContext === true;
  if (!secure) return 'insecure_context';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'no_media_api';
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return 'no_speech_api';
  return null;
}

function checkMic() {
  const btn = document.getElementById('mic-btn');
  const reason = micDiagnosis();
  if (reason) {
    btn.classList.add('unavailable');
    btn.title = {
      insecure_context: 'Microphone needs a secure (https) connection',
      no_media_api: 'This browser does not expose microphone access here',
      no_speech_api: 'This browser has no speech recognition support',
    }[reason];
  }
}

function toggleMic() {
  if (listening) { stopMic(); return; }
  const reason = micDiagnosis();
  if (reason) {
    toast(document.getElementById('mic-btn').title || 'Microphone unavailable');
    return;
  }
  const btn = document.getElementById('mic-btn');
  navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
    stream.getTracks().forEach(t => t.stop());   // only needed to trigger/confirm the permission prompt
    listening = true;
    btn.classList.add('listening');
    document.getElementById('transcript').classList.add('active');
    document.getElementById('transcript').textContent = 'Listening...';

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.onresult = (e) => {
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      document.getElementById('transcript').textContent = transcript;
      if (e.results[e.results.length-1].isFinal) {
        document.getElementById('cmd').value = transcript;
        document.getElementById('send-btn').disabled = !transcript.trim();
        stopMic();
        sendCmd();
      }
    };
    recognition.onerror = (e) => { toast('Voice error: ' + e.error); stopMic(); };
    recognition.onend = () => { if (listening) stopMic(); };
    recognition.start();
  }).catch((e) => toast('Microphone permission denied: ' + e.message));
}

function stopMic() {
  listening = false;
  document.getElementById('mic-btn').classList.remove('listening');
  if (recognition) { recognition.stop(); recognition = null; }
  document.getElementById('transcript').classList.remove('active');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// input handling
document.getElementById('cmd').addEventListener('input', () => {
  document.getElementById('send-btn').disabled = !document.getElementById('cmd').value.trim();
});
document.getElementById('cmd').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendCmd(); }
});
document.getElementById('pin-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); login(); }
});
</script>
</body>
</html>
